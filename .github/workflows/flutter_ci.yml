name: Flutter CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Validate Firebase configuration JSON
        run: |
          python -m json.tool firebase.json > /dev/null
          python -m json.tool database.rules.json > /dev/null

      - name: Save resolved dependencies
        uses: actions/upload-artifact@v4
        with:
          name: myshop-resolved-dependencies
          path: pubspec.lock
          retention-days: 7

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Cache public portfolio photos
        run: python scripts/prepare_portfolio_images.py

      - name: Test
        run: flutter test --dart-define=EXPORT_PORTFOLIO_SHOTS=true

      - name: Save portfolio screenshots
        uses: actions/upload-artifact@v4
        with:
          name: myshop-portfolio-screenshots
          path: build/portfolio-screenshots/*.png
          if-no-files-found: error
          retention-days: 30

  ios-simulator-build:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS simulator app
        run: flutter build ios --simulator --debug

      - name: Build unsigned iOS release
        run: |
          flutter build ios --release --no-codesign
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app build/ios/MyShop-iOS-Unsigned-Release.zip

      - name: Save unsigned iOS release
        uses: actions/upload-artifact@v4
        with:
          name: myshop-ios-unsigned-release
          path: build/ios/MyShop-iOS-Unsigned-Release.zip
          retention-days: 30


  android-demo-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build installable demo APK
        run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: myshop-android-demo-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
